name: Appointment reminders

# تنبيه تليجرام قبل كل موعد بساعتين و10 دقايق (اطبع الحجز وسلّمه للعميل)
# جدولة GitHub (cron) بتتأخر ساعات، فالـ job هنا "مراقب" شغال حوالي 5 ساعات ونص ويفحص كل 20 ثانية،
# ولما يخلص بيشغّل اللي بعده بنفسه على طول. الـ cron بالساعة مجرد احتياطي لو السلسلة وقفت لأي سبب.
# محتاج Secret واحد: FIREBASE_SERVICE_ACCOUNT  (Settings → Secrets and variables → Actions)
# اختياري (Variables): APP_TZ (الافتراضي Africa/Cairo) و SITE_URL (لو الموقع على دومين خاص)

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write   # عشان يشغّل الـ run اللي بعده

# run واحد بس شغال في نفس الوقت، والباقي بيستنى دوره (مفيش تنبيه مكرر)
concurrency:
  group: remind
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --prefix scripts --no-audit --no-fund

      - name: Watch & send reminders
        id: watch
        run: node scripts/remind.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          APP_TZ: ${{ vars.APP_TZ }}
          SITE_URL: ${{ vars.SITE_URL }}
          WATCH_MINUTES: '340'

      - name: Start next watcher
        if: always() && steps.watch.outputs.chain == 'true'
        run: gh workflow run remind.yml --ref "${{ github.ref_name }}" -R "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ github.token }}
