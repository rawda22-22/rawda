name: Screenshots archive bot

# 🗂 بوت أرشيف الاسكرينات (منفصل عن الموقع): صورة ← رقم مرجعي، ورقم ← الصورة.
# بيشتغل كل 5 دقايق. اختياري: Secret اسمه RECEIPTS_BOT_TOKEN لبوت مستقل (غير كده بيستخدم بوت الإشعارات).

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: receipts-bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --prefix scripts --no-audit --no-fund

      - name: Archive screenshots
        run: node scripts/receipts.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          RECEIPTS_BOT_TOKEN: ${{ secrets.RECEIPTS_BOT_TOKEN }}
